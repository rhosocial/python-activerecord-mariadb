    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"
        pip install codecov build

    - name: Install activerecord and testsuite from PyPI
      run: |
        pip install "rhosocial-activerecord[test] @ git+https://github.com/rhosocial/python-activerecord.git@release/v1.0.0.dev26"
