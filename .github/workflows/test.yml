# .github/workflows/test.yml
name: Python Test and Coverage with MariaDB

on:
  push:
    branches:
    - main
    - "release/v**"
    - "maint/**"
  pull_request:
    branches:
    - main
    - "release/v**"
    - "maint/**"

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  test-py39-mariadb102:
    name: Run tests with Python 3.9 and MariaDB 10.2
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.2
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
        - 13702:3306

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python 3.9
      uses: actions/setup-python@v6
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    - name: Install activerecord and testsuite from PyPI
      run: |
        pip install "rhosocial-activerecord[test] @ git+https://github.com/rhosocial/python-activerecord.git@release/v1.0.0.dev26"
        pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev13"

    - name: Create MariaDB scenario config
      run: |
        cat > mariadb_scenarios.yaml << EOF
        scenarios:
          mariadb_102:
            host: 127.0.0.1
            port: 13702
            database: test_db
            username: root
            password: password
            charset: utf8mb4
            autocommit: true
            ssl_disabled: true
        EOF
        echo "MARIADB_SCENARIOS_CONFIG_PATH=$(pwd)/mariadb_scenarios.yaml" >> $GITHUB_ENV

    - name: Run tests
      run: |
        export PYTHONPATH=src
        python -m pytest tests/ --ignore=tests/rhosocial/activerecord/backend/mariadb

