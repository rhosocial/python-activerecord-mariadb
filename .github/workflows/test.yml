            username: root
            password: password
            charset: utf8mb4
            autocommit: true
            ssl_disabled: true
        EOF
        echo "MARIADB_SCENARIOS_CONFIG_PATH=$(pwd)/mariadb_scenarios.yaml" >> $GITHUB_ENV

    - name: Run tests with coverage
      run: |
        export PYTHONPATH=src
        coverage run -m pytest tests/ --ignore=tests/rhosocial/activerecord/backend/mariadb
        coverage xml
        coverage report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests,python-3.14,mariadb-11.8
        name: codecov-mariadb-3.14-11.8
        fail_ci_if_error: false

