# .github/workflows/test.yml
name: Python Test and Coverage with MariaDB

on:
  push:
    branches:
      - main
      - "release/v**"
      - "maint/**"
  pull_request:
    branches:
      - main
      - "release/v**"
      - "maint/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  formal-rules-contracts:
    name: Formal rules contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install activerecord and testsuite
        run: |
          pip install "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@feature/activerecord-migration"  # NOSONAR
          pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-migration"  # NOSONAR

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install -r requirements-dev.txt

      - name: Create MariaDB scenario config
        # ``tests/conftest.py`` loads this file at collection time, so it has to
        # exist before pytest starts. Nothing here connects: the gate reads
        # source only and no service is started in this job.
        run: |
          cat > mariadb_scenarios.yaml << EOF
          scenarios:
            mariadb_default:
              host: 127.0.0.1
              port: 3306
              database: test_db
              username: root
              password: password
              charset: utf8mb4
              autocommit: true
              ssl_disabled: true
          EOF
          echo "MARIADB_SCENARIOS_CONFIG_PATH=$(pwd)/mariadb_scenarios.yaml" >> $GITHUB_ENV

      - name: Formal rules contracts
        # Pure source and signature assertions: no database, no service. Every
        # database job needs this one, so a structural regression fails here in
        # a minute instead of after a full matrix run.
        run: |
          export PYTHONPATH=src:tests
          python -m pytest tests/rhosocial/activerecord_mariadb_test/feature/rules -q -p no:warnings

  test:
    name: Python ${{ matrix.python-version }} / MariaDB ${{ matrix.mariadb-version }}
    needs: formal-rules-contracts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: '3.9', mariadb-version: '10.2', health-cmd: 'mysqladmin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-22.04 }
          - { python-version: '3.10', mariadb-version: '10.3', health-cmd: 'mysqladmin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-24.04 }
          - { python-version: '3.11', mariadb-version: '10.4', health-cmd: 'mysqladmin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-24.04 }
          - { python-version: '3.12', mariadb-version: '10.5', health-cmd: 'mysqladmin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-24.04 }
          - { python-version: '3.12', mariadb-version: '10.6', health-cmd: 'mysqladmin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-24.04 }
          - { python-version: '3.13', mariadb-version: '10.11', health-cmd: 'mysqladmin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-24.04 }
          - { python-version: '3.13', mariadb-version: '11.4', health-cmd: 'mariadb-admin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-24.04 }
          - { python-version: '3.14', mariadb-version: '11.7', health-cmd: 'mariadb-admin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-26.04 }
          - { python-version: '3.14', mariadb-version: '11.8', health-cmd: 'mariadb-admin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-26.04 }
          - { python-version: '3.14t', mariadb-version: '12.0', health-cmd: 'mariadb-admin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-26.04 }
          - { python-version: '3.14t', mariadb-version: '12.2', health-cmd: 'mariadb-admin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-26.04 }
          - { python-version: '3.14t', mariadb-version: '12.3', health-cmd: 'mariadb-admin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-26.04 }
          - { python-version: '3.14t', mariadb-version: '13.0', health-cmd: 'mariadb-admin ping -h 127.0.0.1 -u root -ppassword', os: ubuntu-26.04 }

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: test_db
        options: >-
          --health-cmd="${{ matrix.health-cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install activerecord and testsuite
        run: |
          pip install "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@feature/activerecord-migration"  # NOSONAR
          pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-migration"  # NOSONAR

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install -r requirements-dev.txt

      - name: Create MariaDB scenario config
        run: |
          cat > mariadb_scenarios.yaml << EOF
          scenarios:
            mariadb_default:
              host: 127.0.0.1
              port: 3306
              database: test_db
              username: root
              password: password
              charset: utf8mb4
              autocommit: true
              ssl_disabled: true
          EOF
          echo "MARIADB_SCENARIOS_CONFIG_PATH=$(pwd)/mariadb_scenarios.yaml" >> $GITHUB_ENV

      - name: Run tests (skip for coverage job)
        if: matrix.mariadb-version != '11.8'
        run: |
          export PYTHONPATH=src:tests
          python -m pytest tests/ --ignore=tests/rhosocial/activerecord/backend/mariadb --tb=short -n 8 --dist=loadgroup -x --ignore=tests/benchmark --ignore=tests/rhosocial/activerecord_mariadb_test/feature/rules

      - name: Run tests with coverage (only for MariaDB 11.8)
        if: matrix.mariadb-version == '11.8'
        run: |
          export PYTHONPATH=src:tests
          pip install codecov
          python -m pytest tests/ --ignore=tests/rhosocial/activerecord/backend/mariadb --tb=short --cov=rhosocial.activerecord.backend.impl.mariadb --cov-report=xml -n 8 --dist=loadgroup --ignore=tests/benchmark --ignore=tests/rhosocial/activerecord_mariadb_test/feature/rules

      - name: Upload coverage to Codecov
        if: matrix.mariadb-version == '11.8'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests,python-${{ matrix.python-version }},mariadb-${{ matrix.mariadb-version }}
          name: codecov-mariadb-${{ matrix.python-version }}-${{ matrix.mariadb-version }}
          fail_ci_if_error: false

  test-python-315:
    name: Python ${{ matrix.python-version }}${{ matrix.freethreaded && 't' || '' }} / MariaDB ${{ matrix.mariadb-version }}
    needs: formal-rules-contracts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: '3.15', mariadb-version: '12.3', freethreaded: false, os: ubuntu-26.04 }
          - { python-version: '3.15', mariadb-version: '13.0', freethreaded: true, os: ubuntu-26.04 }
          - { python-version: '3.14', mariadb-version: '13.1-rc', freethreaded: false, os: ubuntu-26.04 }

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: test_db
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}${{ matrix.freethreaded && ' free-threaded' || '' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          freethreaded: ${{ matrix.freethreaded }}

      - name: Install activerecord and testsuite
        run: |
          pip install "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@feature/activerecord-migration"  # NOSONAR
          pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-migration"  # NOSONAR

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install -r requirements-dev.txt

      - name: Create MariaDB scenario config
        run: |
          cat > mariadb_scenarios.yaml << EOF
          scenarios:
            mariadb_default:
              host: 127.0.0.1
              port: 3306
              database: test_db
              username: root
              password: password
              charset: utf8mb4
              autocommit: true
              ssl_disabled: true
          EOF
          echo "MARIADB_SCENARIOS_CONFIG_PATH=$(pwd)/mariadb_scenarios.yaml" >> $GITHUB_ENV

      - name: Run tests
        run: |
          export PYTHONPATH=src:tests
          python -m pytest tests/ --ignore=tests/rhosocial/activerecord/backend/mariadb --tb=short --ignore=tests/benchmark --ignore=tests/rhosocial/activerecord_mariadb_test/feature/rules

  benchmark-python-315:
    name: Run benchmarks with Python 3.15 / MariaDB 12.3
    needs: formal-rules-contracts
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: test_db
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python 3.15
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Install activerecord and testsuite
        run: |
          pip install "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@feature/activerecord-migration"  # NOSONAR
          pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-migration"  # NOSONAR

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install -r requirements-dev.txt

      - name: Create MariaDB scenario config
        run: |
          cat > mariadb_scenarios.yaml << EOF
          scenarios:
            mariadb_default:
              host: 127.0.0.1
              port: 3306
              database: test_db
              username: root
              password: password
              charset: utf8mb4
              autocommit: true
              ssl_disabled: true
          EOF
          echo "MARIADB_SCENARIOS_CONFIG_PATH=$(pwd)/mariadb_scenarios.yaml" >> $GITHUB_ENV

      - name: Run benchmark suite
        run: |
          set -o pipefail
          export PYTHONPATH=src:tests
          TESTSUITE_DIR=$(python - <<'PY'
          import pathlib
          import rhosocial.activerecord.testsuite as testsuite

          print(pathlib.Path(testsuite.__file__).parent)
          PY
          )
          python -m pytest \
            -p tests.benchmark.providers \
            --rootdir=. \
            --confcutdir=. \
            "$TESTSUITE_DIR/benchmark/crud/core/test_delete_async.py" \
            "$TESTSUITE_DIR/benchmark/crud/core/test_delete.py" \
            "$TESTSUITE_DIR/benchmark/crud/core/test_insert_async.py" \
            "$TESTSUITE_DIR/benchmark/crud/core/test_insert.py" \
            "$TESTSUITE_DIR/benchmark/crud/core/test_query_async.py" \
            "$TESTSUITE_DIR/benchmark/crud/core/test_query.py" \
            "$TESTSUITE_DIR/benchmark/crud/core/test_update_async.py" \
            "$TESTSUITE_DIR/benchmark/crud/core/test_update.py" \
            "$TESTSUITE_DIR/benchmark/query" \
            "$TESTSUITE_DIR/benchmark/transaction" \
            "$TESTSUITE_DIR/benchmark/mixin" \
            -m benchmark \
            --benchmark-size=small \
            --benchmark-sort=mean \
            --tb=short | tee benchmark-output.txt
          if [ -d tests/benchmark/backend ]; then
            python -m pytest \
              --rootdir=. \
              --confcutdir=. \
              tests/benchmark/backend \
              -m benchmark \
              --benchmark-size=small \
              --benchmark-sort=mean \
              --tb=short | tee -a benchmark-output.txt
          fi

      - name: Write benchmark conclusion
        if: always()
        run: |
          {
            echo "## Python 3.15 MariaDB Benchmark Conclusion"
            echo
            echo "- Python: 3.15"
            echo "- MariaDB: 12.3"
            echo "- Scope: testsuite generic benchmarks + MariaDB backend direct benchmarks"
            echo "- Size: small"
            echo "- Result: benchmark job fails only when benchmark execution or correctness checks fail."
            echo
            echo '```text'
            grep -A 120 "benchmark:" benchmark-output.txt || cat benchmark-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

